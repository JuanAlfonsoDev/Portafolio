    <h1>CONTACTO</h1>
    <form action="">
        <!-- Nombre completo-->
        <label for="full_name">Nombre completo:</label>
        <input type="text" id="full_name" name="name" placeholder="Juan Perez" required><br>
        <!-- Correo completo-->
        <label for="email" >Correo:</label>
        <input type="email" id="email" name="email" placeholder="example@example.com" required><br>
        <!-- Telefono completo-->
        <label for="telefono">Telefono:</label>
        <input type="text" id="telefono"  name="phone" placeholder="312 456 7890" required><br>
        <!-- Nombre completo de la empresa-->
        <label for="company">Empresa</label>
        <input type="text" id="company" name="companyName" placeholder="Empresa software" required><br>
        <!-- Nombre de la ciudad-->
        <label for="city">Ciudad:</label>
        <input type="text" id="city" name="city" placeholder="Bogota D.C, Colombia" required><br>
        <!-- Mensaje adicional -->
        <label for="text_comments">Mensaje adicional</label>
        <textarea name="" id="text_comments" rows="5" cols="40" placeholder="Ejemplo te que queremos para este tipo de trabajo"></textarea><br>
        <input type="submit">

    </form>
